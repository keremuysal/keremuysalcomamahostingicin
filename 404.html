<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="404 - Sayfa Bulunamadı | Kerem Uysal" />
    <meta name="author" content="Kerem Uysal" />
    <title>404 - Sayfa Bulunamadı | Kerem Uysal</title>
    <link type="image/x-icon" rel="shortcut icon" href="/img/galaktik.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #fa5b0f;
            --bg-dark: #01143e;
            --code-bg: #030d24;
            --text-light: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Montserrat', monospace, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-card {
            background: var(--code-bg);
            border: 1px solid rgba(250, 91, 15, 0.3);
            border-radius: 12px;
            padding: 40px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 15px;
        }
        .error-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
        }
        .error-desc {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-home {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s ease;
        }
        .btn-home:hover {
            background: #c03d00;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">Aradığınız Sayfa Bulunamadı</h1>
        <p class="error-desc">
            Ulaşmaya çalıştığınız sayfa taşınmış, silinmiş veya hiç var olmamış olabilir.
        </p>
        <a href="/" class="btn-home">Anasayfaya Dön</a>
    </div>
</body>
</html>
